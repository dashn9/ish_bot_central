name: Deploy ish-bot-identities-server with Gunicorn, Nginx, and SSL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' 

    - name: Install dependencies locally (optional)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn

    - name: Upload code to server (excluding .git folder)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_DOMAIN }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "./"
        target: "~/ish-bot-identities-server"
        rm: true
        exclude: |
          .git

    - name: Set up Gunicorn, Nginx, and SSL
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_DOMAIN }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo apt-get update
          sudo apt-get install -y nginx python3-venv

          # Create virtual environment and install dependencies
          python3 -m venv ~/ish-bot-identities-server/.venv
          source ~/ish-bot-identities-server/.venv/bin/activate
          pip install --upgrade pip
          pip install -r ~/ish-bot-identities-server/requirements.txt
          pip install gunicorn


          sudo rm -r /var/www/ish-bot-identities-server
          sudo mv ~/ish-bot-identities-server /var/www/
          
          sudo systemctl start nginx
          sudo systemctl enable nginx
          
          sudo tee /etc/systemd/system/gunicorn.service <<EOF
          [Unit]
          Description=Gunicorn instance to serve ish-bot-identities-server
          After=network.target

          [Service]
          User=${{ secrets.SERVER_USER }}
          Group=www-data
          WorkingDirectory=/var/www/ish-bot-identities-server
          Environment="PATH=/var/www/ish-bot-identities-server/.venv/bin"
          ExecStart=/var/www/ish-bot-identities-server/.venv/bin/gunicorn --workers 3 --bind unix:/var/www/ish-bot-identities-server/ish_bot.sock wsgi:app

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl start gunicorn
          sudo systemctl enable gunicorn

          sudo tee /etc/nginx/sites-available/ish-bot-identities-server <<EOF
          server {
              listen 80;
              server_name ${{ secrets.SERVER_DOMAIN }};

              location / {
                  include proxy_params;
                  proxy_pass http://unix:/var/www/ish-bot-identities-server/ish_bot.sock;
              }

              location /static/ {
                  alias /var/www/ish-bot-identities-server/static/;
              }
          }
          EOF

          sudo ln -sf /etc/nginx/sites-available/ish-bot-identities-server /etc/nginx/sites-enabled
          sudo nginx -t
          sudo systemctl restart nginx
